name: Deploy Hugo site & Auto Publish Columns

on:
  schedule:
    - cron: '0 * * * *'   # 매 시간 정각 자동 발행 검사 (00:00 UTC = 09:00 KST, 04:00 UTC = 13:00 KST, 08:00 UTC = 17:00 KST, 12:00 UTC = 21:00 KST 등)
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm install

      - name: Auto Publish Slot & Broadcast to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8714560419:AAGq9Ufb2jLTKVUGQFdW4Rb574oGNYZCq30' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '2026055528' }}
        run: node scripts/auto-publish-slot.js

      - name: Commit and Push History & Thumbnails
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publish-history.json static/thumbnails/
          if ! git diff --cached --quiet; then
            git commit -m "chore(auto-publish): sync publish history and thumbnails"
            git push origin HEAD:main || echo "Push failed or already up to date"
          else
            echo "No new publish changes to commit"
          fi

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.22'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --cleanDestinationDir \
            --minify \
            --baseURL "https://healim-bp.com/"

      - name: Deploy to Cloudflare Pages (Production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || 'c8e59a8e577d3d00aaddd908e16255d0' }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning ::CLOUDFLARE_API_TOKEN is not set in GitHub Secrets. Cloudflare deploy skipped. (Please add CLOUDFLARE_API_TOKEN to repository secrets for 24/7 cloud deployments)"
          else
            echo "🚀 Deploying to Cloudflare Pages project 'healim-clinic'..."
            npx wrangler pages deploy public --project-name=healim-clinic --branch=main --commit-dirty=true
            echo "🎉 Cloudflare Pages deployment completed successfully!"
          fi

      - name: Setup Pages (GitHub Pages Backup)
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload artifact for GitHub Pages
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: publish-and-build
    continue-on-error: true
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
